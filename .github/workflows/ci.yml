name: Mavis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Lint all scripts
        run: ruff check scripts/
      - name: Verify all scripts executable
        run: |
          for f in scripts/*.py scripts/*.sh; do
            [ -x "$f" ] || [ ! -f "$f" ] || (echo "FAIL: $f not executable" && exit 1)
          done
          echo "All scripts executable"
